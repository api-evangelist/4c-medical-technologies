aid: 4c-medical-technologies
name: 4C Medical Technologies
description: >-
  4C Medical Technologies, Inc. is a privately held, clinical-stage medical device company
  headquartered at 6655 Wedgwood Road North, Suite 160, Maple Grove, Minnesota, developing
  minimally invasive therapies for structural heart disease. Its lead product is the AltaValve
  System, a supra-annular transcatheter mitral valve replacement (TMVR) device delivered by
  transseptal or transapical catheter and designed to expand the treatable severe mitral
  regurgitation patient population, streamline the procedure and preserve the native mitral
  valve; the device is fully recapturable until released from the delivery catheter. AltaValve
  holds FDA Breakthrough Device designation and is enrolling the ATLAS global pivotal trial
  (NCT06465745) in the United States and Europe. The company closed a $175M Series D financing
  led by Boston Scientific in March 2025. It is a physical medical device manufacturer and
  publishes no developer program, public API, SDK or machine-readable API contract of any kind.
